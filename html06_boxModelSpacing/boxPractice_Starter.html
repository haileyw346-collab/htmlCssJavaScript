<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Practice</title>
  <style>
    *{
      box-sizing: border-box;
      outline: 1px solid blue;
}

    body {
      font-family: Arial, sans-serif;
      margin: 0;                  /* remove the browser's default space around the page */
      background-color: #eeeeee;
    }
    /* Add each new rule below this line */
    .card{
      width:300px;
      height:400px;
      background-color: #ffffff;
      padding: 16px 32px;
      border: 2px solid #ff0000;
      border-radius: 8px;
      margin: 1rem;
    }

    .card h2{
      margin-top: 0.5rem;
    }

    main{
      max-width: 750px;
      display:flex;
      margin: 0 auto;
      padding: 1rem;
    }

  </style>
</head>
<body>
  <header>
    <h1>Box Model Practice</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h2>Card One</h2>
      <p>A card is a box with a heading and some text.</p>
    </div>
    <div class="card">
      <h2>Card Two</h2>
      <p>We will use cards to learn padding, border, and margin.</p>
    </div>
  </main>
</body>
</html>
